apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsfrontend
  labels:
    app: devopsfrontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopsfrontend
  template:
    metadata:
      labels:
        app: devopsfrontend
    spec:
      containers:
      - name: devopsfrontend
        image: pongphisut/devopsfrontend:v1.0
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: devopsfrontend-service
spec:
  selector:
    app: devopsfrontend
  ports:
    - protocol: TCP
      port: 5173
      targetPort: 80
  type: ClusterIP