apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-fanout-example
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: devopsbackend-service
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devopsfrontend-service
            port:
              number: 5173
