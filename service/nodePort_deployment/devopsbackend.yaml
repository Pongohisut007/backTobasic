apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsbackend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopsbackend
  template:
    metadata:
      labels:
        app: devopsbackend
    spec:
      containers:
        - name: devopsbackend
          image: pongphisut/devopsbackend:v1.0
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
---
apiVersion: v1
kind: Service
metadata:
  name: devopsbackend-service
spec:
  type: NodePort
  selector:
    app: devopsbackend
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080