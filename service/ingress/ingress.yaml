apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-fanout-example
spec:
  rules:
  - host: foo.bar.com
    http:
      paths:
      - path: /home
        pathType: Prefix
        backend:
          service:
            name: service1
            port:
              number: 5172
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: service2
            port:
              number: 3000
